<script>
  const fileInput = document.getElementById('file');
  const dropzone = document.getElementById('dropzone');
  const statusEl = document.getElementById('status');
  const workEl = document.getElementById('work');

  function say(msg, kind) {
    statusEl.style.display = msg ? 'block' : 'none';
    statusEl.className = kind || '';
    statusEl.textContent = msg || '';
  }

  async function uploadAndProcess(file) {
    if (!file) return;

    say('Uploading & processing on secure backend...', 'warn');

    const formData = new FormData();
    formData.append('file', file);

    try {
      const response = await fetch('/api/v1/clean-gemini', {
        method: 'POST',
        body: formData
      });

      if (!response.ok) {
        throw new Error('Server returned error during cleaning.');
      }

      const blob = await response.blob();
      const downloadUrl = URL.createObjectURL(blob);

      // Wire Download Button
      const downloadBtn = document.getElementById('download');
      downloadBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `cleaned_${file.name}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      say('Gemini watermark & metadata cleared successfully!', 'ok');
      workEl.style.display = 'block';
    } catch (err) {
      console.error(err);
      say('Error processing image. Please try another file.', 'bad');
    }
  }

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) uploadAndProcess(fileInput.files[0]);
  });

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('over');
    if (e.dataTransfer.files[0]) uploadAndProcess(e.dataTransfer.files[0]);
  });
</script>
